packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# pnpm 11+ no longer reads engine-strict from .npmrc; enforce it here (the
# .npmrc line stays for npm and other tools).
engineStrict: true

catalog:
  typescript: ~6.0.3
  eslint: ^10.14.0
  jiti: ^2.7.0
  typescript-eslint: ^8.72.1
  vitest: ^5.1.0
  '@types/node': ^24.19.2
  zod: ^4.6.7

# eslint-plugin-jsx-a11y 6.10.2 (latest) declares eslint <= 9 as its peer range;
# it is loaded through @eslint/compat's fixupPluginRules on ESLint 10.
# Transitive security fixes. Each advisory is recorded in
# docs/security-review-v0.1.0.md; drop an override once its parent ships the fix.
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.6
  minimatch@>=7.0.0 <11.0.1: ^11.0.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.2

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    # nestjs-zod 5.6.0 declares Nest <= 11; its @nestjs/common usage is unchanged in 12.
    nestjs-zod>@nestjs/common: '12'

allowBuilds:
  lefthook: true
  '@swc/core': true
  esbuild: true
  sharp: true
  # testcontainers pulls these in through docker-modem/ssh2. They are optional native
  # accelerators (ssh2 falls back to pure JS), so their build scripts stay off.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # The CPU binaries ship inside the package; its postinstall only downloads optional CUDA
  # execution-provider files, which the built-in embedding model does not use.
  onnxruntime-node: false

minimumReleaseAgeExclude:
  - nestjs-zod@5.6.0
  - nodemailer@10.5.0
  - jose@6.2.17
