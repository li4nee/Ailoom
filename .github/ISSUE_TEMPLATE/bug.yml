# SPDX-License-Identifier: AGPL-3.0-only
name: Bug Report
description: File a bug report for AiLoom
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out this form completely.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of AiLoom are you running? (commit SHA or release tag)
      placeholder: e.g. v0.1.0 or abc1234
    validations:
      required: true

  - type: input
    id: deployment-method
    attributes:
      label: Deployment method
      description: How is AiLoom deployed?
      placeholder: e.g. docker compose, source, production
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs from the api/worker containers.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that may be helpful.
