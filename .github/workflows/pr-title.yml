# SPDX-License-Identifier: AGPL-3.0-only
name: 'PR Title Check'

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
