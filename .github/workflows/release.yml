# SPDX-License-Identifier: AGPL-3.0-only
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write # OIDC for GHCR + cosign keyless signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: li4nee
  API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ailoom-api
  WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ailoom-web
  # Strip the leading 'v' from the tag for the image version.
  VERSION: ${{ github.ref_name }}

jobs:
  release-notes:
    name: release notes
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build changelog body since previous tag
        id: notes
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-version:refname | head -n 1 | head -n 1)"
          if [ -z "$previous" ] || [ "$previous" = "${{ github.ref_name }}" ]; then
            range="HEAD"
          else
            range="${previous}..HEAD"
          fi
          {
            echo "## ${{ github.ref_name }}"
            echo ""
            git log --format='- %s (%h)' "$range" | grep -E '^(feat|fix|build|chore|refactor|perf|test|docs)\(|revert|merge' || true
          } > "$GITHUB_OUTPUT_DIR/notes.md" 2>/dev/null || {
            {
              echo "## ${{ github.ref_name }}"
              echo ""
              git log --format='- %s (%h)' "$range"
            } > "$GITHUB_OUTPUT_DIR/notes.md"
          }
          notes="$(cat "$GITHUB_OUTPUT_DIR/notes.md")"
          notes="${notes//'%'/'%25'}"
          notes="${notes//$'\n'/'%0A'}"
          notes="${notes//$'\r'/'%0D'}"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: build and publish
    runs-on: ubuntu-24.04
    needs: release-notes
    outputs:
      api-digest: ${{ steps.api-build.outputs.digest }}
      web-digest: ${{ steps.web-build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@960024c9e6d284577ed90f5edfa2db94880262c7 # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@7e995e9b4dd0739b5e04c972e69140b2e9ef89f7 # v4.0.0
        with:
          images: ${{ env.API_IMAGE }},${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=ailoom
            org.opencontainers.image.description=Self-hosted AI customer support platform
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push api image (multi-arch)
        id: api-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-release
          cache-to: type=gha,mode=max,scope=api-release
          sbom: true
          provenance: true

      - name: Build and push web image (multi-arch)
        id: web-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release
          sbom: true
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@60e84da9b3be5e1d1d25c4e4ce7f904e9dc59b47 # v3.6.0

      - name: Sign api image with cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign ${{ env.API_IMAGE }}@${{ steps.api-build.outputs.digest }} \
            --yes \
            --oidc-issuer https://token.actions.githubusercontent.com

      - name: Sign web image with cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign ${{ env.WEB_IMAGE }}@${{ steps.web-build.outputs.digest }} \
            --yes \
            --oidc-issuer https://token.actions.githubusercontent.com

  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    needs: [release-notes, build-and-publish]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de230e0921386960319e93253757f333e869607c # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.release-notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
