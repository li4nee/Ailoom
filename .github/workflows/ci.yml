# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Depcruise
        run: pnpm --filter @app/api depcruise

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (eslint-config)
        run: pnpm --filter @app/eslint-config test
      - name: Unit tests (api)
        run: pnpm --filter @app/api test:unit

  integration:
    name: integration
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore models cache
        uses: actions/cache/restore@v4.2.0
        with:
          path: apps/api/models
          key: models-${{ hashFiles('apps/api/models/manifest.json') }}
      - name: Fetch models
        run: pnpm --filter @app/api fetch-model
      - name: Integration tests
        run: pnpm --filter @app/api test:int
      - name: E2E tests
        run: pnpm --filter @app/api test:e2e

  db-check:
    name: db-check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm --filter @app/api db:migrate
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app
      - name: Check migrations
        run: pnpm --filter @app/api db:check
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  reuse:
    name: reuse
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: REUSE lint
        uses: fsfe/reuse-action@v3.0.0

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production audit
        run: pnpm audit --prod --audit-level critical
      - name: License check
        run: cd apps/api && pnpm licenses list --prod --json | node ../../scripts/check-licenses.mjs

  docker:
    name: docker
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    env:
      # Tag the smoke test runs; it matches the image names in deploy/docker-compose.yml.
      VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Build api image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ghcr.io/li4nee/ailoom-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          load: true
          tags: ghcr.io/li4nee/ailoom-web:ci
      # smoke.sh writes its own throwaway env file and reuses the images built above.
      - name: Run smoke test
        run: bash deploy/smoke.sh
        env:
          SMOKE_BUILD: '0'
          PUBLIC_URL: http://localhost:8080
          HTTP_PORT: '8080'
