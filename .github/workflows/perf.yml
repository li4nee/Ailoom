# SPDX-License-Identifier: AGPL-3.0-only
name: performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the 2 CPU / 4 GB stack
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          PUBLIC_URL=http://localhost:18090
          HTTP_PORT=18090
          HTTPS_PORT=18443
          POSTGRES_USER=ailoom
          POSTGRES_PASSWORD=perfpassword1234
          POSTGRES_DB=ailoom
          AUTH_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WIDGET_SECRET=wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww
          ENCRYPTION_KEYS=v1:abababababababababababababababababababababababababababababababab
          DEMO_MODE=true
          VERSION=perf
          EOF
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.perf.yml \
            --env-file .env up -d --build --wait --wait-timeout 600
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.perf.yml \
            --env-file .env exec -T api node dist/cli/seed.js --force-demo

      - name: TTFT overhead
        env:
          API_URL: http://localhost:13000
          PUBLIC_URL: http://localhost:18090
          DATABASE_URL: postgres://ailoom:perfpassword1234@127.0.0.1:15432/ailoom
          WIDGET_ORIGIN: http://localhost:8090
          PERF_DURATION_S: '60'
          PERF_OUTPUT: artifacts/perf/ttft-overhead.json
        run: pnpm --filter @app/api exec node -r @swc-node/register test/perf/ttft-overhead.ts

      - name: Retrieval latency
        env:
          DATABASE_URL: postgres://ailoom:perfpassword1234@127.0.0.1:15432/ailoom
          PERF_OUTPUT: artifacts/perf/retrieval-latency.json
        run: pnpm --filter @app/api exec node -r @swc-node/register test/perf/retrieval-latency.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: artifacts/perf/
          if-no-files-found: warn

      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.perf.yml \
            --env-file .env logs --no-color --tail 100 || true
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.perf.yml \
            --env-file .env down -v --remove-orphans || true
