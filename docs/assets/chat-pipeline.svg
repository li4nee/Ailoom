<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 952" width="1120" height="952" role="img" aria-labelledby="title desc">
  <title id="title">Chat pipeline</title>
  <desc id="desc">The visitor-message pipeline: guard, persist, gate, intent, query, retrieve, decide, assemble, generate, finalize. Stages 4, 5, 7, 8 and the finalize helpers are pure functions. Gate, intent and decide can exit early without calling the LLM. Finalize writes the AI message, trace, usage and notification in one transaction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #475569; }
      .m { font-family: &quot;JetBrains Mono&quot;, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .lbl { font-size: 12px; font-weight: 600; fill: #475569; letter-spacing: .04em; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="952" rx="16" fill="#ffffff"/>
  <rect x="40" y="30" width="640" height="40" rx="20" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text class="m" x="360.0" y="56" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">POST /api/widget/v1/conversations/:id/messages</text>
  <path class="line" d="M360.0,70 L360.0,84" marker-end="url(#arrow)"/>
  <rect x="40" y="86" width="640" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="70" cy="116.0" r="15" fill="#3b82f6"/>
  <text class="t" x="70" y="121.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">1</text>
  <text class="t h" x="98" y="111">guard</text>
  <text class="t s" x="98" y="132">visitor token · origin · rate limits · conversation ownership</text>
  <path class="line" d="M360.0,146 L360.0,160" marker-end="url(#arrow)"/>
  <rect x="40" y="162" width="640" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="70" cy="192.0" r="15" fill="#3b82f6"/>
  <text class="t" x="70" y="197.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">2</text>
  <text class="t h" x="98" y="187">persist</text>
  <text class="t s" x="98" y="208">insert visitor message</text>
  <path class="line" d="M360.0,222 L360.0,236" marker-end="url(#arrow)"/>
  <rect x="40" y="238" width="640" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="70" cy="268.0" r="15" fill="#3b82f6"/>
  <text class="t" x="70" y="273.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">3</text>
  <text class="t h" x="98" y="263">gate</text>
  <text class="t s" x="98" y="284">conversation status · spend cap</text>
  <path class="line" d="M680,268.0 L738,268.0" marker-end="url(#arrow)"/>
  <rect x="740" y="238" width="350" height="60" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t" x="756" y="263" font-size="13" font-weight="600">status ≠ ai → stop (a human owns it)</text>
  <text class="t s" x="756" y="284">spend cap reached → escalate</text>
  <path class="line" d="M360.0,298 L360.0,312" marker-end="url(#arrow)"/>
  <rect x="40" y="314" width="640" height="60" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="70" cy="344.0" r="15" fill="#22c55e"/>
  <text class="t" x="70" y="349.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">4</text>
  <text class="t h" x="98" y="339">intent</text>
  <text class="m" x="200" y="339">detectHandoffIntent()</text>
  <text class="t s" x="98" y="360">multi-word phrase, message ≤ 12 words</text>
  <rect x="618" y="324" width="39" height="20" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text class="t" x="637" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">pure</text>
  <path class="line" d="M680,344.0 L738,344.0" marker-end="url(#arrow)"/>
  <rect x="740" y="314" width="350" height="60" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t" x="756" y="339" font-size="13" font-weight="600">match → offer handoff</text>
  <text class="t s" x="756" y="360">trace · stop (no retrieval, no LLM)</text>
  <path class="line" d="M360.0,374 L360.0,388" marker-end="url(#arrow)"/>
  <rect x="40" y="390" width="640" height="60" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="70" cy="420.0" r="15" fill="#22c55e"/>
  <text class="t" x="70" y="425.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">5</text>
  <text class="t h" x="98" y="415">query</text>
  <text class="m" x="200" y="415">buildRetrievalQuery()</text>
  <text class="t s" x="98" y="436">latest message + previous if &lt; 6 words</text>
  <rect x="618" y="400" width="39" height="20" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text class="t" x="637" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">pure</text>
  <path class="line" d="M360.0,450 L360.0,464" marker-end="url(#arrow)"/>
  <rect x="40" y="466" width="640" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="70" cy="496.0" r="15" fill="#3b82f6"/>
  <text class="t" x="70" y="501.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">6</text>
  <text class="t h" x="98" y="491">retrieve</text>
  <text class="m" x="200" y="491">RetrievalRepository.search()</text>
  <text class="t s" x="98" y="512">iterative HNSW scan · filtered by bot + embedding model</text>
  <path class="line" d="M360.0,526 L360.0,540" marker-end="url(#arrow)"/>
  <rect x="40" y="542" width="640" height="60" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="70" cy="572.0" r="15" fill="#22c55e"/>
  <text class="t" x="70" y="577.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">7</text>
  <text class="t h" x="98" y="567">decide</text>
  <text class="m" x="200" y="567">decideEscalation()</text>
  <text class="t s" x="98" y="588">no knowledge · top score below threshold</text>
  <rect x="618" y="552" width="39" height="20" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text class="t" x="637" y="566" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">pure</text>
  <path class="line" d="M680,572.0 L738,572.0" marker-end="url(#arrow)"/>
  <rect x="740" y="542" width="350" height="60" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t" x="756" y="567" font-size="13" font-weight="600">escalate → fallback / offer / auto handoff</text>
  <text class="t s" x="756" y="588">trace · stop (no LLM call)</text>
  <path class="line" d="M360.0,602 L360.0,616" marker-end="url(#arrow)"/>
  <rect x="40" y="618" width="640" height="60" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="70" cy="648.0" r="15" fill="#22c55e"/>
  <text class="t" x="70" y="653.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">8</text>
  <text class="t h" x="98" y="643">assemble</text>
  <text class="m" x="200" y="643">assemblePrompt()</text>
  <text class="t s" x="98" y="664">platform rules · operator prompt · sources · history</text>
  <rect x="618" y="628" width="39" height="20" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text class="t" x="637" y="642" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">pure</text>
  <path class="line" d="M360.0,678 L360.0,692" marker-end="url(#arrow)"/>
  <rect x="40" y="694" width="640" height="60" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="70" cy="724.0" r="15" fill="#f97316"/>
  <text class="t" x="70" y="729.0" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">9</text>
  <text class="t h" x="98" y="719">generate</text>
  <text class="m" x="200" y="719">llm.streamChat()</text>
  <text class="t s" x="98" y="740">Vercel AI SDK streamText · AnswerSink.delta() per token</text>
  <path class="line" d="M680,724.0 L738,724.0" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <rect x="740" y="694" width="350" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="756" y="719" font-size="13" font-weight="600">SSE  answer.delta → widget</text>
  <text class="t s" x="756" y="740">streamed token by token; abort on disconnect</text>
  <path class="line" d="M360.0,754 L360.0,768" marker-end="url(#arrow)"/>
  <rect x="40" y="770" width="640" height="118" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="70" cy="800" r="15" fill="#8b5cf6"/>
  <text class="t" x="70" y="805" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">10</text>
  <text class="t h" x="98" y="805">finalize</text>
  <text class="m" x="200" y="805">parseCitations() · applyLinkPolicy()</text>
  <rect x="618" y="790" width="39" height="20" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text class="t" x="637" y="804" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">pure</text>
  <rect x="98" y="822" width="560" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t lbl" x="114" y="843">ONE TRANSACTION</text>
  <text class="m" x="114" y="863">AI message + generation trace + usage_daily upsert + pg_notify</text>
  <path class="line" d="M680,847 L738,847" marker-end="url(#arrow)"/>
  <rect x="740" y="817" width="350" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="756" y="842" font-size="13" font-weight="600">NOTIFY delivered only on commit</text>
  <text class="t s" x="756" y="863">admin live view + widget events update</text>
  <rect x="40" y="909" width="18" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t s" x="66" y="923">I/O (DB, auth)</text>
  <rect x="183.60000000000002" y="909" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t s" x="209.60000000000002" y="923">pure function</text>
  <rect x="319.8" y="909" width="18" height="18" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t s" x="345.8" y="923">LLM provider</text>
  <rect x="448.6" y="909" width="18" height="18" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t s" x="474.6" y="923">early exit</text>
  <rect x="562.6" y="909" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t s" x="588.6" y="923">persist</text>
</svg>
