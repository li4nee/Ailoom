<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Visitor handoff to a support agent</title>
  <desc id="desc">A visitor can ask for a person, accept an offer, or be handed off under the bot's no-answer policy. Provider failures and spend limits offer handoff. The visitor may provide an optional email. The conversation appears as Needs human in the inbox; an agent replies in the same widget thread and may return the conversation to AI or close it.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}.h{font-size:17px;font-weight:700}.s{font-size:13px;fill:#475569}.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;fill:#475569}.line{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="470" rx="16" fill="#fff"/>
  <text class="t h" x="40" y="42">A person takes over when the visitor or bot needs one</text>
  <rect x="40" y="112" width="220" height="116" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text class="t h" x="58" y="148">Visitor or bot</text><text class="t s" x="58" y="174">Ask for a person · accept offer</text><text class="t s" x="58" y="196">No-answer policy · provider/spend issue</text>
  <rect x="330" y="112" width="220" height="116" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text class="t h" x="348" y="148">Handoff choice</text><text class="t s" x="348" y="174">Short phrase offers yes/no</text><text class="t s" x="348" y="196">Declining retries normal answer flow</text>
  <rect x="620" y="112" width="220" height="116" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/><text class="t h" x="638" y="148">Needs human</text><text class="t s" x="638" y="174">Optional email capture</text><text class="t s" x="638" y="196">Bot pauses in this thread</text>
  <rect x="910" y="112" width="250" height="116" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text class="t h" x="928" y="148">Shared team inbox</text><text class="t s" x="928" y="174">Notification · agent assignment</text><text class="t s" x="928" y="196">Agent takes over</text>
  <path class="line" d="M260 170H328"/><path class="line" d="M550 170H618"/><path class="line" d="M840 170H908"/>
  <text class="t lbl" x="40" y="292">AGENT RESOLUTION</text>
  <rect x="80" y="314" width="300" height="88" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/><text class="t h" x="100" y="350">Agent replies in inbox</text><text class="t s" x="100" y="377">Live update appears in the same widget thread</text>
  <rect x="480" y="314" width="250" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text class="t h" x="500" y="350">Return to AI</text><text class="t s" x="500" y="377">Agent can hand the thread back</text>
  <rect x="830" y="314" width="250" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text class="t h" x="850" y="350">Close conversation</text><text class="t s" x="850" y="377">Optional CSAT prompt follows</text>
  <path class="line" d="M1035 228V270H230V312"/><path class="line" d="M380 358H478"/><path class="line" d="M380 382H830"/>
</svg>
