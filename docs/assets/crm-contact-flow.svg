<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">CRM contact delivery</title>
  <desc id="desc">A workspace admin connects a CRM, optionally through OAuth. A host site verifies the visitor and calls the widget identify method. AiLoom stores the contact update and outbox job in one transaction. The background worker sends the mapped identity fields through a workspace-scoped CRM adapter and records delivery history. This path does not import CRM data or create tickets.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}.h{font-size:17px;font-weight:700}.s{font-size:13px;fill:#475569}.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;fill:#475569}.line{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="410" rx="16" fill="#fff"/><text class="t h" x="40" y="42">Identified contact update</text>
  <rect x="40" y="112" width="220" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text class="t h" x="58" y="148">Workspace admin</text><text class="t s" x="58" y="176">Connect CRM · map fields</text><text class="t s" x="58" y="196">OAuth where supported</text>
  <rect x="330" y="112" width="220" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text class="t h" x="348" y="148">Verified host visitor</text><text class="t s" x="348" y="176">Widget identify call</text><text class="t s" x="348" y="196">Approved identity fields</text>
  <rect x="620" y="112" width="220" height="104" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text class="t h" x="638" y="148">AiLoom database</text><text class="t s" x="638" y="176">Contact + outbox atomically</text><text class="t s" x="638" y="196">Encrypted credentials</text>
  <rect x="910" y="112" width="250" height="104" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/><text class="t h" x="928" y="148">Worker + CRM adapter</text><text class="t s" x="928" y="176">Guarded HTTPS delivery</text><text class="t s" x="928" y="196">Retry + record receipt</text>
  <path class="line" d="M260 164H328"/><path class="line" d="M550 164H618"/><path class="line" d="M840 164H908"/>
  <rect x="300" y="286" width="600" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text class="t h" x="324" y="320">Connected CRM contact</text><text class="t s" x="324" y="345">Mapped identity fields and delivery status; no CRM import, ticket creation, or transcript sync.</text>
  <path class="line" d="M1035 216V254H600V284"/>
</svg>
