  <rect x="214.0" y="236" width="139.0" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="m" x="283.5" y="259" text-anchor="middle">retrieval</text>
  <rect x="365.0" y="236" width="139.0" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="m" x="434.5" y="259" text-anchor="middle">knowledge</text>
  <rect x="516.0" y="236" width="139.0" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="m" x="585.5" y="259" text-anchor="middle">conversations</text>
  <rect x="667.0" y="236" width="139.0" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="m" x="736.5" y="259" text-anchor="middle">traces</text>
