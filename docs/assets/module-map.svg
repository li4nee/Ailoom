  <rect x="667.0" y="474" width="139.0" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="m" x="736.5" y="497" text-anchor="middle">email</text>
  <rect x="214.0" y="520" width="189.33333333333334" height="36" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
