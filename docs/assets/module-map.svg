<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 798" width="1270" height="798" role="img" aria-labelledby="title desc">
  <title id="title">Module map</title>
  <desc id="desc">Backend modules in layers from HTTP edge through orchestration (chat), domain modules, providers, platform modules, db and common. Imports only point downward, with no cycles; packages/shared holds the API contracts used by api, admin and widget.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #475569; }
      .m { font-family: &quot;JetBrains Mono&quot;, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .lbl { font-size: 12px; font-weight: 600; fill: #475569; letter-spacing: .04em; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1270" height="798" rx="16" fill="#ffffff"/>
  <rect x="200" y="30" width="620" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t lbl" x="30" y="69.0">HTTP EDGE</text>
  <rect x="214.0" y="44" width="290.0" height="36" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="m" x="359.0" y="67" text-anchor="middle">widget controllers</text>
  <rect x="516.0" y="44" width="290.0" height="36" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="m" x="661.0" y="67" text-anchor="middle">admin controllers (one per module)</text>
  <rect x="200" y="126" width="620" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t lbl" x="30" y="165.0">ORCHESTRATION</text>
  <rect x="214.0" y="140" width="592.0" height="36" rx="9" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
  <text class="m" x="510.0" y="163" text-anchor="middle">chat</text>
  <rect x="200" y="222" width="620" height="116" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
