  <rect x="200" y="698" width="620" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="t lbl" x="30" y="737.0">FOUNDATION</text>
  <rect x="214.0" y="712" width="592.0" height="36" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text class="m" x="510.0" y="735" text-anchor="middle">common  ·  config · errors · logging · crypto · safe-fetch · ids · clock</text>
  <path class="line" d="M510.0,102 L510.0,124" marker-end="url(#arrow)"/>
  <path class="line" d="M510.0,198 L510.0,220" marker-end="url(#arrow)"/>
  <path class="line" d="M510.0,340 L510.0,362" marker-end="url(#arrow)"/>
  <path class="line" d="M510.0,436 L510.0,458" marker-end="url(#arrow)"/>
  <path class="line" d="M510.0,578 L510.0,600" marker-end="url(#arrow)"/>
  <path class="line" d="M510.0,674 L510.0,696" marker-end="url(#arrow)"/>
  <path class="line" d="M806,161.0 L844,161.0 L844,399.0 L822,399.0" marker-end="url(#arrow)"/>
  <text class="t s" x="852" y="280.0">chat → providers</text>
  <rect x="970" y="30" width="270" height="150" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text class="m" x="986" y="58" font-weight="700">packages/shared</text>
  <rect x="986" y="72" width="32" height="20" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text class="t" x="1002" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#854d0e">MIT</text>
  <text class="t s" x="986" y="116">Zod schemas · API + event</text>
  <text class="t s" x="986" y="134">types · error codes · enums</text>
  <text class="t s" x="986" y="160">used by api · admin · widget</text>
  <rect x="970" y="262" width="270" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t lbl" x="986" y="290">RULES (dependency-cruiser)</text>
  <text class="t s" x="986" y="322">• imports point down only</text>
  <text class="t s" x="986" y="356">• no cycles</text>
  <text class="t s" x="986" y="390">• cross-module: index.ts only</text>
  <text class="t s" x="986" y="424">• domain/ = pure TypeScript</text>
  <text class="t s" x="986" y="458">• MIT never imports AGPL</text>
</svg>
