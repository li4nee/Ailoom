<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Optional CRM conversation context enrichment</title>
  <desc id="desc">When an agent closes a conversation, AiLoom queues enrichment only when custom CRM fields are mapped. The worker sends recent completed messages to the configured model, which returns a summary and conservative classifications. AiLoom writes only mapped fields to HubSpot, Pipedrive, or Intercom. The transcript itself is not sent to the CRM, and this feature is off by default.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}.h{font-size:17px;font-weight:700}.s{font-size:13px;fill:#475569}.line{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="410" rx="16" fill="#fff"/><text class="t h" x="40" y="42">Optional CRM context sync · off by default</text>
  <rect x="40" y="112" width="220" height="108" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text class="t h" x="58" y="148">Agent closes thread</text><text class="t s" x="58" y="176">Only with mapped CRM fields</text><text class="t s" x="58" y="198">Otherwise no enrichment job</text>
  <rect x="330" y="112" width="220" height="108" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/><text class="t h" x="348" y="148">Background worker</text><text class="t s" x="348" y="176">Loads up to 32 recent</text><text class="t s" x="348" y="198">completed messages</text>
  <rect x="620" y="112" width="220" height="108" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text class="t h" x="638" y="148">Configured model</text><text class="t s" x="638" y="176">Summary + evidence-based</text><text class="t s" x="638" y="198">labels; unknown if unclear</text>
  <rect x="910" y="112" width="250" height="108" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text class="t h" x="928" y="148">Mapped CRM fields</text><text class="t s" x="928" y="176">Context-only contact update</text><text class="t s" x="928" y="198">No transcript sent to CRM</text>
  <path class="line" d="M260 166H328"/><path class="line" d="M550 166H618"/><path class="line" d="M840 166H908"/>
  <rect x="230" y="292" width="740" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="t s" x="254" y="320">HubSpot · Pipedrive · Intercom</text><text class="t s" x="254" y="342">Normal bot spend cap and trace/usage recording apply; treat generated labels as a triage aid.</text>
  <path class="line" d="M1035 220V260H600V290"/>
</svg>
