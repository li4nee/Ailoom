<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">AiLoom outbound HTTP and MCP tool architecture</title>
  <desc id="desc">The admin configures and versions a fixed HTTP GET or one selected remote MCP tool. During a visitor turn, the model proposes a call using the reviewed schema. AiLoom validates it and calls the configured destination. Only allowlisted scalar result fields return to the assistant. Failures become a generic unavailable result and follow the configured fallback behavior.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}
      .h{font-size:18px;font-weight:700}
      .s{font-size:14px;fill:#475569}
      .label{font-size:12px;font-weight:700;letter-spacing:.05em;fill:#475569}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#fff"/>
  <text class="t h" x="40" y="44">Admin controls the tool contract; AiLoom owns the call path</text>
  <text class="t label" x="40" y="84">CONTROL PLANE · CONFIGURED BEFORE PUBLISHING</text>
  <rect x="40" y="100" width="470" height="94" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t h" x="60" y="136">Admin defines and tests</text>
  <text class="t s" x="60" y="164">Fixed endpoint · reviewed schema · rules · allowlisted result · failure behavior</text>
  <rect x="690" y="100" width="470" height="94" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t h" x="710" y="136">Versioned bot tool</text>
  <text class="t s" x="710" y="164">Immutable contract · disabled until test and review pass</text>
  <path class="line" d="M510 147H688"/>

  <text class="t label" x="40" y="242">RUNTIME · THE MODEL NEVER CONNECTS TO THE REMOTE SERVER</text>
  <rect x="40" y="264" width="190" height="112" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t h" x="56" y="300">Visitor turn</text>
  <text class="t s" x="56" y="328">Normal chat request</text>
  <text class="t s" x="56" y="350">+ conversation context</text>

  <rect x="270" y="264" width="195" height="112" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t h" x="286" y="300">Assistant model</text>
  <text class="t s" x="286" y="328">Sees enabled names</text>
  <text class="t s" x="286" y="350">and input schemas</text>

  <rect x="505" y="264" width="205" height="112" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="521" y="300">AiLoom validates</text>
  <text class="t s" x="521" y="328">Pinned version · inputs</text>
  <text class="t s" x="521" y="350">budget · safe destination</text>

  <rect x="750" y="264" width="195" height="112" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t h" x="766" y="300">Remote service</text>
  <text class="t s" x="766" y="328">Fixed HTTPS GET or</text>
  <text class="t s" x="766" y="350">selected MCP tool</text>

  <rect x="985" y="264" width="175" height="112" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t h" x="1001" y="300">Project result</text>
  <text class="t s" x="1001" y="328">Allowlisted scalars</text>
  <text class="t s" x="1001" y="350">back to assistant</text>

  <path class="line" d="M230 320H268"/>
  <path class="line" d="M465 320H503"/>
  <path class="line" d="M710 320H748"/>
  <path class="line" d="M945 320H983"/>
  <path class="line" d="M1072 376V410H368V378"/>

  <rect x="40" y="424" width="700" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text class="t s" x="58" y="454">Failure → generic unavailable result → grounded answer or configured fallback; never invent missing data.</text>
  <rect x="760" y="424" width="400" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t s" x="778" y="454">Short-lived MCP client · no visitor identity binding · no write actions</text>
</svg>
