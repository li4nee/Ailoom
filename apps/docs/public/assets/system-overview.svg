<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="title desc">
  <title id="title">System overview</title>
  <desc id="desc">Customer websites and admin browsers connect over HTTPS to the web container (Caddy plus the admin SPA), which routes /api and widget paths to the api service. The api, worker and migrate services share one image and use Postgres 18 with pgvector, pg-boss and LISTEN/NOTIFY. All outbound calls to LLM providers, email and crawled websites go through safeFetch. Ollama is an optional compose profile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t  { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h  { font-size: 17px; font-weight: 700; }
      .s  { font-size: 13px; fill: #475569; }
      .m  { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .lbl{ font-size: 12px; font-weight: 600; fill: #475569; letter-spacing: .04em; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="710" rx="16" fill="#ffffff"/>

  <!-- external actors -->
  <rect x="30" y="118" width="220" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t h" x="50" y="152">Customer website</text>
  <text class="m" x="50" y="178">&lt;script widget.js&gt;</text>

  <rect x="30" y="298" width="220" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t h" x="50" y="332">Admin browser</text>
  <text class="t s" x="50" y="358">agents · admins · owners</text>

  <!-- compose frame -->
  <rect x="290" y="40" width="880" height="500" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="t lbl" x="312" y="68">DOCKER COMPOSE · SINGLE HOST</text>

  <!-- web (Caddy + SPA) -->
  <rect x="320" y="90" width="300" height="300" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t h" x="340" y="122">web</text>
  <text class="t s" x="340" y="144">Caddy 2 + admin SPA (static files)</text>
  <line x1="340" y1="160" x2="600" y2="160" stroke="#bfdbfe"/>
  <text class="m" x="340" y="190">/</text>
  <text class="t s" x="470" y="190">→ admin SPA</text>
  <text class="m" x="340" y="225">/api/*</text>
  <text class="t s" x="470" y="225">→ api (SSE)</text>
  <text class="m" x="340" y="260">/widget.js</text>
  <text class="t s" x="470" y="260">→ api</text>
  <text class="m" x="340" y="282">/widget/*</text>
  <line x1="340" y1="306" x2="600" y2="306" stroke="#bfdbfe"/>
  <text class="t s" x="340" y="334">TLS (Let's Encrypt) · HSTS · CSP</text>
  <text class="t s" x="340" y="356">only public entrypoint</text>

  <!-- actor → web -->
  <path class="line" d="M250,160 L318,160" marker-end="url(#arrow)"/>
  <text class="t lbl" x="258" y="150">HTTPS</text>
  <path class="line" d="M250,340 L318,340" marker-end="url(#arrow)"/>
  <text class="t lbl" x="258" y="330">HTTPS</text>

  <!-- app group (one image) -->
  <rect x="664" y="80" width="252" height="336" rx="16" fill="none" stroke="#14b8a6" stroke-width="1.2" stroke-dasharray="4 4"/>

  <rect x="680" y="94" width="220" height="92" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="698" y="124">api</text>
  <text class="t s" x="698" y="146">NestJS · Fastify</text>
  <text class="t s" x="698" y="168">HTTP · SSE · auth · chat</text>

  <rect x="680" y="200" width="220" height="84" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="698" y="230">worker</text>
  <text class="t s" x="698" y="252">pg-boss jobs: ingest,</text>
  <text class="t s" x="698" y="272">embed, email, cleanup</text>

  <rect x="680" y="298" width="220" height="74" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="698" y="328">migrate</text>
  <text class="t s" x="698" y="350">one-shot, before api/worker</text>

  <text class="t lbl" x="680" y="402">ONE IMAGE · …/&lt;name&gt;-api</text>

  <!-- web → api -->
  <path class="line" d="M620,225 L645,225 L645,140 L678,140" marker-end="url(#arrow)"/>

  <!-- postgres -->
  <rect x="955" y="94" width="190" height="278" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t h" x="975" y="126">Postgres 18</text>
  <text class="t s" x="975" y="148">single source of truth</text>
  <line x1="975" y1="164" x2="1125" y2="164" stroke="#ddd6fe"/>
  <text class="t s" x="975" y="192">• relational data</text>
  <text class="t s" x="975" y="220">• pgvector ≥ 0.8 (HNSW)</text>
  <text class="t s" x="975" y="248">• pg-boss job queue</text>
  <text class="t s" x="975" y="276">• LISTEN / NOTIFY</text>
  <text class="t s" x="975" y="304">• uuidv7()</text>
  <text class="t s" x="975" y="348">volume: postgres_data</text>

  <!-- app → postgres -->
  <path class="line" d="M900,140 L953,140" marker-end="url(#arrow)"/>
  <path class="line" d="M900,242 L953,242" marker-end="url(#arrow)"/>
  <path class="line" d="M900,335 L953,335" marker-end="url(#arrow)"/>

  <!-- ollama (optional) -->
  <rect x="320" y="428" width="300" height="82" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="t h" x="340" y="460">ollama <tspan class="s" font-weight="400">(optional)</tspan></text>
  <text class="m" x="340" y="486">--profile ollama</text>

  <!-- outbound bus -->
  <path class="line" d="M790,416 L790,598" marker-end="url(#arrow)"/>
  <path class="line dash" d="M790,469 L622,469" marker-end="url(#arrow)"/>
  <text class="t s" x="640" y="460">local models</text>

  <!-- safeFetch pill on the frame edge -->
  <rect x="684" y="524" width="212" height="32" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t" x="790" y="545" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">safeFetch (SSRF-guarded)</text>

  <!-- outbound targets -->
  <rect x="470" y="600" width="640" height="78" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t lbl" x="490" y="626">OUTBOUND HTTPS</text>
  <text class="t" x="490" y="654" font-size="15">LLM &amp; embedding providers  ·  SMTP / Resend  ·  crawled websites</text>
</svg>
