<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" width="1120" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">Ingestion pipeline</title>
  <desc id="desc">Knowledge ingestion: the api inserts a source and enqueues ingest.source in one transaction; the worker reads files or discovers and fetches URLs, extracts text with quality warnings, normalizes and hashes it, stops if unchanged, otherwise stores a new document version, chunks it, embeds the chunks, and swaps the current version in one transaction before rolling up the source status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #475569; }
      .m { font-family: &quot;JetBrains Mono&quot;, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0f172a; }
      .lbl { font-size: 12px; font-weight: 600; fill: #475569; letter-spacing: .04em; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="1080" rx="16" fill="#ffffff"/>
  <rect x="40" y="30" width="600" height="58" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t h" x="60" y="54">Admin adds a source</text>
  <text class="t s" x="60" y="75">text · file · URL · sitemap</text>
  <rect x="594.4" y="39" width="32" height="20" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text class="t" x="610" y="53" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">api</text>
  <path class="line" d="M340.0,88 L340.0,102" marker-end="url(#arrow)"/>
  <rect x="40" y="104" width="600" height="58" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t h" x="60" y="128">Insert + enqueue</text>
  <text class="m" x="229.6" y="128">ingest.source</text>
  <text class="t s" x="60" y="149">knowledge_sources row + job in the same transaction</text>
  <rect x="594.4" y="113" width="32" height="20" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text class="t" x="610" y="127" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">api</text>
  <path class="line" d="M340.0,162 L340.0,186" marker-end="url(#arrow)"/>
  <rect x="40" y="188" width="600" height="58" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="60" y="212">ingest.source</text>
  <text class="t s" x="60" y="233">route by source type</text>
  <rect x="594.4" y="197" width="32" height="20" rx="10" fill="#ffffff" stroke="#14b8a6"/>
  <text class="t" x="610" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">job</text>
  <path class="line" d="M340.0,246 L340.0,260 L185.0,260 L185.0,274" marker-end="url(#arrow)"/>
  <path class="line" d="M340.0,260 L495.0,260 L495.0,274" marker-end="url(#arrow)"/>
  <rect x="40" y="276" width="290.0" height="100" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="58" y="302">text / file</text>
  <text class="t s" x="58" y="324">read upload from FileStorage</text>
  <text class="t s" x="58" y="344">magic-byte check</text>
  <rect x="350.0" y="276" width="290.0" height="100" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="368.0" y="302">URL / sitemap</text>
  <text class="t s" x="368.0" y="324">discover URLs · robots.txt · globs · ≤ 500</text>
  <text class="t s" x="368.0" y="344">one ingest.page job per URL</text>
  <text class="t s" x="368.0" y="362" font-size="12">safeFetch · ≤ 2 per domain</text>
  <path class="line" d="M185.0,376 L185.0,390 L340.0,390 L340.0,404" marker-end="url(#arrow)"/>
  <path class="line" d="M495.0,376 L495.0,390 L340.0,390"/>
  <rect x="40" y="406" width="600" height="58" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="60" y="430">Extract</text>
  <text class="t s" x="60" y="451">HTML → Readability → Markdown · PDF per page · DOCX</text>
  <rect x="594.4" y="415" width="32" height="20" rx="10" fill="#ffffff" stroke="#14b8a6"/>
  <text class="t" x="610" y="429" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">job</text>
  <path class="line" d="M640,435.0 L698,435.0" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <rect x="700" y="400" width="390" height="70" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text class="t" x="716" y="424" font-size="13" font-weight="600">quality warnings (shown in admin)</text>
  <text class="t s" x="716" y="444">js_rendered_suspected · pdf_no_text_layer</text>
  <text class="t s" x="716" y="462">truncated · low_text_content</text>
  <path class="line" d="M340.0,464 L340.0,478" marker-end="url(#arrow)"/>
  <rect x="40" y="480" width="600" height="58" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t h" x="60" y="504">Normalize + hash</text>
  <text class="t s" x="60" y="525">whitespace, zero-width chars, boilerplate · SHA-256</text>
  <rect x="587.2" y="489" width="39" height="20" rx="10" fill="#ffffff" stroke="#22c55e"/>
  <text class="t" x="607" y="503" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">pure</text>
  <path class="line" d="M340.0,538 L340.0,552" marker-end="url(#arrow)"/>
  <rect x="40" y="554" width="600" height="58" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t h" x="60" y="578">Content changed?</text>
  <text class="t s" x="60" y="599">compare hash with current document_version</text>
  <rect x="587.2" y="563" width="39" height="20" rx="10" fill="#ffffff" stroke="#22c55e"/>
  <text class="t" x="607" y="577" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">pure</text>
  <path class="line" d="M640,583.0 L698,583.0" marker-end="url(#arrow)"/>
  <text class="t lbl" x="654" y="575.0">no</text>
  <rect x="700" y="554" width="390" height="58" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t" x="716" y="578" font-size="13" font-weight="600">stop: nothing to re-embed</text>
  <text class="t s" x="716" y="599">update last_synced_at only</text>
  <path class="line" d="M340.0,612 L340.0,632" marker-end="url(#arrow)"/>
  <text class="t lbl" x="350.0" y="628">yes</text>
  <rect x="40" y="634" width="600" height="58" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="60" y="658">New document_version</text>
  <text class="t s" x="60" y="679">content stored as normalized Markdown</text>
  <rect x="594.4" y="643" width="32" height="20" rx="10" fill="#ffffff" stroke="#14b8a6"/>
  <text class="t" x="610" y="657" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">job</text>
  <path class="line" d="M340.0,692 L340.0,706" marker-end="url(#arrow)"/>
  <rect x="40" y="708" width="600" height="58" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t h" x="60" y="732">Chunk</text>
  <text class="t s" x="60" y="753">headings → paragraphs → sentences · 400 / 700 tokens · heading path</text>
  <rect x="587.2" y="717" width="39" height="20" rx="10" fill="#ffffff" stroke="#22c55e"/>
  <text class="t" x="607" y="731" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">pure</text>
  <path class="line" d="M340.0,766 L340.0,780" marker-end="url(#arrow)"/>
  <rect x="40" y="782" width="600" height="58" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t h" x="60" y="806">embed.chunks</text>
  <text class="t s" x="60" y="827">batches of 64 (16 local) · llm.embed() · tagged with embedding model</text>
  <rect x="594.4" y="791" width="32" height="20" rx="10" fill="#ffffff" stroke="#f97316"/>
  <text class="t" x="610" y="805" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">job</text>
  <path class="line" d="M640,811.0 L698,811.0" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <rect x="700" y="782" width="390" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="716" y="806" font-size="13" font-weight="600">built-in local model or provider</text>
  <text class="t s" x="716" y="827">tokens + cost → usage_daily</text>
  <path class="line" d="M340.0,840 L340.0,854" marker-end="url(#arrow)"/>
  <rect x="40" y="856" width="600" height="86" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t lbl" x="60" y="882">ONE TRANSACTION</text>
  <text class="m" x="60" y="906">set current_version_id · delete old chunks</text>
  <text class="m" x="60" y="928">pg_notify → admin sees live status</text>
  <path class="line" d="M340.0,942 L340.0,956" marker-end="url(#arrow)"/>
  <rect x="40" y="958" width="600" height="58" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t h" x="60" y="982">Source status</text>
  <text class="t s" x="60" y="1003">ready when no page jobs remain · failed → user-facing error</text>
  <rect x="594.4" y="967" width="32" height="20" rx="10" fill="#ffffff" stroke="#14b8a6"/>
  <text class="t" x="610" y="981" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">job</text>
  <rect x="40" y="1037" width="18" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="t s" x="66" y="1051">api request</text>
  <rect x="161.4" y="1037" width="18" height="18" rx="4" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text class="t s" x="187.4" y="1051">pg-boss job</text>
  <rect x="282.8" y="1037" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="t s" x="308.8" y="1051">pure function</text>
  <rect x="419.0" y="1037" width="18" height="18" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text class="t s" x="445.0" y="1051">model call</text>
  <rect x="533.0" y="1037" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="t s" x="559.0" y="1051">transaction</text>
  <rect x="654.4" y="1037" width="18" height="18" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text class="t s" x="680.4" y="1051">early exit</text>
</svg>
