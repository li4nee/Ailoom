<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop SPA</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        padding: 24px;
      }
      #route {
        color: #1d4ed8;
        margin-right: 16px;
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <h1 id="title">Home</h1>
      <button id="route" type="button">Browse products</button>
    </main>
    <script>
      // A tiny history-API router: the page never reloads, so the widget must survive.
      const routes = {
        '/': 'Home',
        '/products': 'Products',
        '/products/widget': 'Widget stand',
      };
      function render() {
        document.getElementById('title').textContent = routes[window.location.pathname] ?? 'Home';
      }
      document.getElementById('route').addEventListener('click', () => {
        const atHome = window.location.pathname === '/' || window.location.pathname === '/spa.html';
        const next = atHome ? '/products' : '/products/widget';
        window.history.pushState({}, '', next);
        render();
      });
      window.addEventListener('popstate', render);
      render();
    </script>
    <script src="/boot.js" defer></script>
  </body>
</html>
