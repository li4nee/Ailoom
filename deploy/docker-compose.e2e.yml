# Browser end-to-end stack: the production compose file plus Mailpit, with the app sending
# real SMTP to it. Used by e2e/global-setup.ts; run from the repo root:
#
#   docker compose -p ailoom-e2e -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml \
#     --env-file .env.e2e up -d --build --wait
#
# Mailpit's API is published on 127.0.0.1:18025 so the tests can read the mail.
services:
  # Static host pages for the widget browser tests. `shop.localhost` resolves to loopback on
  # the test machine; publishing on all interfaces lets both IPv4 and IPv6 loopback reach it.
  host:
    image: nginx:alpine
    ports:
      - '8090:80'
    volumes:
      - ../e2e/host-pages:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/hostile.html']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:18025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    environment:
      # The mock provider is available outside production; these tests never call a real model.
      NODE_ENV: test
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      EMAIL_FROM: 'AiLoom <no-reply@ailoom.test>'
    depends_on:
      mailpit:
        condition: service_healthy

  worker:
    environment:
      NODE_ENV: test
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      EMAIL_FROM: 'AiLoom <no-reply@ailoom.test>'
    depends_on:
      mailpit:
        condition: service_healthy
