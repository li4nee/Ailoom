services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    image: ghcr.io/${ORG:-ailoom}/ailoom-api:${VERSION:-latest}
    command: ['node', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    env_file: .env

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ghcr.io/${ORG:-ailoom}/ailoom-api:${VERSION:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - files_data:/data/files
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/live').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ghcr.io/${ORG:-ailoom}/ailoom-api:${VERSION:-latest}
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - files_data:/data/files
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', 'dist/cli/worker-health.js']
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: .env

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: ghcr.io/${ORG:-ailoom}/ailoom-web:${VERSION:-latest}
    ports:
      - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
      - '443:443'
    depends_on:
      api:
        condition: service_healthy
    env_file: .env

  ollama:
    profiles: ['ollama']
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    env_file: .env

volumes:
  postgres_data:
  files_data:
  ollama_data:
